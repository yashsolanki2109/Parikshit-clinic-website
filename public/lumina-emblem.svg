<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="luminaBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e657e"/>
      <stop offset="100%" stop-color="#003842"/>
    </linearGradient>
    <linearGradient id="luminaToothGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7f9"/>
    </linearGradient>
    <filter id="luminaDotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="0" y="0" width="40" height="40" rx="11" fill="url(#luminaBgGrad)"/>
  
  <!-- Subtle inner border for crisp luxury finish -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="10.5" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1"/>

